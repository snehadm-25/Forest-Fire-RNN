<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Classifer - AI Diagnostics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-radial"></div>
    <div class="container">
        <header>
            <h1>🔥 Forest Fire <span class="accent">Classifier</span></h1>
            <p>Predict wildfire risks using meteorological data and Bidirectional LSTMs.</p>
        </header>

        <main>
            <form id="predictForm" class="glass-panel">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="X">X Coordinate (1-9)</label>
                        <input type="number" id="X" name="X" min="1" max="9" value="7" required>
                    </div>
                    <div class="form-group">
                        <label for="Y">Y Coordinate (2-9)</label>
                        <input type="number" id="Y" name="Y" min="2" max="9" value="5" required>
                    </div>
                    <div class="form-group">
                        <label for="month">Month</label>
                        <select id="month" name="month" required>
                            <option value="jan">January</option>
                            <option value="feb">February</option>
                            <option value="mar">March</option>
                            <option value="apr">April</option>
                            <option value="may">May</option>
                            <option value="jun">June</option>
                            <option value="jul">July</option>
                            <option value="aug" selected>August</option>
                            <option value="sep">September</option>
                            <option value="oct">October</option>
                            <option value="nov">November</option>
                            <option value="dec">December</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="day">Day</label>
                        <select id="day" name="day" required>
                            <option value="mon">Monday</option>
                            <option value="tue">Tuesday</option>
                            <option value="wed">Wednesday</option>
                            <option value="thu">Thursday</option>
                            <option value="fri" selected>Friday</option>
                            <option value="sat">Saturday</option>
                            <option value="sun">Sunday</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="FFMC">FFMC Index</label>
                        <input type="number" step="0.1" id="FFMC" name="FFMC" value="91.0" required>
                    </div>
                    <div class="form-group">
                        <label for="DMC">DMC Index</label>
                        <input type="number" step="0.1" id="DMC" name="DMC" value="166.9" required>
                    </div>
                    <div class="form-group">
                        <label for="DC">DC Index</label>
                        <input type="number" step="0.1" id="DC" name="DC" value="752.6" required>
                    </div>
                    <div class="form-group">
                        <label for="ISI">ISI Index</label>
                        <input type="number" step="0.1" id="ISI" name="ISI" value="7.1" required>
                    </div>
                    <div class="form-group">
                        <label for="temp">Temperature (°C)</label>
                        <input type="number" step="0.1" id="temp" name="temp" value="25.9" required>
                    </div>
                    <div class="form-group">
                        <label for="RH">Rel. Humidity (%)</label>
                        <input type="number" id="RH" name="RH" value="41" required>
                    </div>
                    <div class="form-group">
                        <label for="wind">Wind Speed (km/h)</label>
                        <input type="number" step="0.1" id="wind" name="wind" value="3.6" required>
                    </div>
                    <div class="form-group">
                        <label for="rain">Rain (mm/m²)</label>
                        <input type="number" step="0.1" id="rain" name="rain" value="0.0" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Run AI Analysis</button>
            </form>

            <div id="resultCard" class="glass-panel hidden">
                <div class="result-header">
                    <h3>Analysis Result</h3>
                </div>
                <div class="result-body">
                    <div id="predictionText" class="prediction-large">---</div>
                    <div class="confidence-bar-container">
                        <div id="confidenceBar" class="confidence-bar"></div>
                    </div>
                    <p id="confidenceText">Confidence: 0%</p>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
